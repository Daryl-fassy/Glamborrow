<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders – Glamborow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a1f30;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── Header ── */
    .orders-header {
      background: #071825;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid gold;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: 1px solid gold;
      color: gold;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: gold;
      color: #071825;
    }

    .orders-header h1 {
      font-size: 1.4em;
      color: gold;
      letter-spacing: 1px;
    }

    /* ── Main content ── */
    .orders-container {
      max-width: 720px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .orders-count {
      color: #aaa;
      font-size: 0.85em;
      margin-bottom: 20px;
    }

    /* ── Order card ── */
    .order-card {
      background: #1e3a52;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
      border-left: 4px solid gold;
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-number {
      color: gold;
      font-weight: bold;
      font-size: 1em;
    }

    .paid-badge {
      color: #2aa006;
      font-size: 0.82em;
    }

    .order-meta p {
      margin: 4px 0;
      font-size: 0.85em;
      color: #ccc;
    }

    .order-meta strong {
      color: #ddd;
    }

    hr.divider {
      border: none;
      border-top: 1px solid #2a4a62;
      margin: 12px 0;
    }

    .items-label {
      font-size: 0.85em;
      color: #ddd;
      margin-bottom: 6px;
    }

    .items-list {
      list-style: none;
      padding: 0;
    }

    .items-list li {
      font-size: 0.82em;
      color: #ccc;
      padding: 5px 0;
      border-bottom: 1px solid #2a4a62;
    }

    .items-list li:last-child {
      border-bottom: none;
    }

    .item-sub {
      color: #888;
      font-size: 0.78em;
    }

    .order-total {
      margin-top: 12px;
      font-size: 0.95em;
      color: white;
    }

    /* ── Delete button ── */
    .delete-btn {
      background: none;
      border: 1px solid #c0392b;
      color: #e74c3c;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82em;
      margin-top: 14px;
      transition: background 0.2s, color 0.2s;
    }

    .delete-btn:hover {
      background: #c0392b;
      color: white;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    .empty-state p {
      font-size: 1.1em;
      margin-bottom: 8px;
    }

    .empty-state small {
      font-size: 0.85em;
      color: #666;
    }

    /* ── Confirmation popup overlay ── */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .popup-overlay.active {
      display: flex;
    }

    .popup-box {
      background: #0f2d42;
      border: 1px solid gold;
      border-radius: 12px;
      padding: 30px 28px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .popup-box p {
      font-size: 1em;
      color: #ddd;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .popup-box p strong {
      color: gold;
    }

    .popup-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .popup-yes {
      background: #c0392b;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.95em;
      font-weight: bold;
      transition: background 0.2s;
    }

    .popup-yes:hover {
      background: #e74c3c;
    }

    .popup-no {
      background: none;
      color: gold;
      border: 1px solid gold;
      padding: 10px 28px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.95em;
      transition: background 0.2s, color 0.2s;
    }

    .popup-no:hover {
      background: gold;
      color: #071825;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="orders-header">
    <button class="back-btn" onclick="window.history.back()">← Back</button>
    <h1>My Orders</h1>
  </div>

  <!-- Orders list -->
  <div class="orders-container">
    <p class="orders-count" id="orders-count"></p>
    <div id="orders-list"></div>
  </div>

  <!-- Confirmation popup -->
  <div class="popup-overlay" id="confirm-overlay">
    <div class="popup-box">
      <p>Are you sure you want to <strong>delete</strong> this order?<br>This cannot be undone.</p>
      <div class="popup-actions">
        <button class="popup-yes" id="confirm-yes">Yes, Delete</button>
        <button class="popup-no" id="confirm-no">No, Keep It</button>
      </div>
    </div>
  </div>

  <script>
    let pendingDeleteIndex = null;

    function renderOrders() {
      const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
      const list = document.getElementById("orders-list");
      const countEl = document.getElementById("orders-count");

      if (history.length === 0) {
        countEl.textContent = "";
        list.innerHTML = `
          <div class="empty-state">
            <p>No previous orders found.</p>
            <small>Orders appear here after a successful payment.</small>
          </div>
        `;
        return;
      }

      countEl.textContent = `${history.length} order${history.length !== 1 ? "s" : ""} found`;

      list.innerHTML = history.map((order, index) => `
        <div class="order-card" id="order-card-${index}">
          <div class="order-top">
            <span class="order-number">Order #${index + 1}</span>
            <span class="paid-badge">✅ Paid</span>
          </div>
          <div class="order-meta">
            <p><strong>Date:</strong> ${order.createdAt || order.date || "N/A"}</p>
            <p><strong>Order ID:</strong> ${order.orderId}</p>
            <p><strong>Email:</strong> ${order.email || order.customerEmail || "N/A"}</p>
          </div>
          <hr class="divider">
          <p class="items-label"><strong>Items:</strong></p>
          <ul class="items-list">
            ${(order.cart || order.items || []).map(item => `
              <li>
                ${item.name} (x${item.quantity}) — R${(parseFloat(item.price) * item.quantity).toFixed(2)}
                <br><span class="item-sub">Size: ${item.size || "N/A"} | Color: ${item.color || "N/A"} | ${item.event || "N/A"}</span>
              </li>
            `).join("")}
          </ul>
          <p class="order-total"><strong>Total: R${parseFloat(order.amount).toFixed(2)}</strong></p>
          <button class="delete-btn" onclick="askDelete(${index})">🗑 Delete Order</button>
        </div>
      `).join("");
    }

    function askDelete(index) {
      pendingDeleteIndex = index;
      document.getElementById("confirm-overlay").classList.add("active");
    }

    document.getElementById("confirm-yes").addEventListener("click", () => {
      if (pendingDeleteIndex === null) return;
      const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
      history.splice(pendingDeleteIndex, 1);
      localStorage.setItem("orderHistory", JSON.stringify(history));
      pendingDeleteIndex = null;
      document.getElementById("confirm-overlay").classList.remove("active");
      renderOrders();
    });

    document.getElementById("confirm-no").addEventListener("click", () => {
      pendingDeleteIndex = null;
      document.getElementById("confirm-overlay").classList.remove("active");
    });

    // Close popup if user clicks outside the box
    document.getElementById("confirm-overlay").addEventListener("click", (e) => {
      if (e.target === document.getElementById("confirm-overlay")) {
        pendingDeleteIndex = null;
        document.getElementById("confirm-overlay").classList.remove("active");
      }
    });

    // Initial render
    renderOrders();
  </script>
</body>
</html>
