<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLAMBORROW — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --dark: #0a0f1a;
      --dark2: #111827;
      --dark3: #1a2235;
      --dark4: #243048;
      --text: #e8e8e8;
      --text-muted: #8899aa;
      --green: #2ecc71;
      --orange: #f39c12;
      --red: #e74c3c;
      --blue: #3498db;
      --purple: #9b59b6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 50%, #1a2a1a 0%, var(--dark) 60%);
    }
    .login-box {
      background: var(--dark2);
      border: 1px solid var(--dark4);
      border-radius: 16px;
      padding: 48px 40px;
      width: 380px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      animation: fadeUp 0.5s ease;
    }
    .login-box h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    .login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 32px; }
    .login-box input {
      width: 100%;
      background: var(--dark3);
      border: 1px solid var(--dark4);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s, transform 0.1s;
    }
    .login-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .login-error {
      color: var(--red);
      font-size: 0.82rem;
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    /* ── MAIN DASHBOARD ── */
    #dashboard { display: none; }

    header {
      background: var(--dark2);
      border-bottom: 1px solid var(--dark4);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }
    .header-left span { color: var(--text-muted); font-size: 0.78rem; }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--dark4);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .main { padding: 32px; max-width: 1400px; margin: 0 auto; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--dark2);
      border: 1px solid var(--dark4);
      border-radius: 12px;
      padding: 20px;
      animation: fadeUp 0.4s ease both;
    }
    .stat-card:nth-child(1) { animation-delay: 0.05s; }
    .stat-card:nth-child(2) { animation-delay: 0.1s; }
    .stat-card:nth-child(3) { animation-delay: 0.15s; }
    .stat-card:nth-child(4) { animation-delay: 0.2s; }
    .stat-card:nth-child(5) { animation-delay: 0.25s; }
    .stat-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text); }
    .stat-value.gold { color: var(--gold); }
    .stat-value.green { color: var(--green); }
    .stat-value.orange { color: var(--orange); }
    .stat-value.red { color: var(--red); }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input {
      background: var(--dark2);
      border: 1px solid var(--dark4);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 260px;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--gold); }
    .filter-select {
      background: var(--dark2);
      border: 1px solid var(--dark4);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      cursor: pointer;
    }
    .refresh-btn {
      background: var(--dark3);
      border: 1px solid var(--dark4);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: auto;
    }
    .refresh-btn:hover { background: var(--dark4); border-color: var(--gold); color: var(--gold); }

    /* ── TABLE ── */
    .table-wrap {
      background: var(--dark2);
      border: 1px solid var(--dark4);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.5s ease 0.3s both;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--dark3); }
    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 500;
    }
    td {
      padding: 14px 16px;
      font-size: 0.85rem;
      border-top: 1px solid var(--dark3);
      vertical-align: top;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .order-id { font-family: monospace; color: var(--gold); font-size: 0.78rem; }
    .customer-email { color: var(--text); font-size: 0.83rem; }
    .customer-phone { color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }
    .amount { font-weight: 600; color: var(--green); }
    .date { color: var(--text-muted); font-size: 0.78rem; }

    /* Status badge */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-pending    { background: rgba(243,156,18,0.15); color: var(--orange); border: 1px solid rgba(243,156,18,0.3); }
    .badge-complete   { background: rgba(46,204,113,0.15); color: var(--green);  border: 1px solid rgba(46,204,113,0.3); }
    .badge-processing { background: rgba(52,152,219,0.15); color: var(--blue);   border: 1px solid rgba(52,152,219,0.3); }
    .badge-delivered  { background: rgba(155,89,182,0.15); color: var(--purple); border: 1px solid rgba(155,89,182,0.3); }
    .badge-returned   { background: rgba(201,168,76,0.15); color: var(--gold);   border: 1px solid rgba(201,168,76,0.3); }
    .badge-refunded   { background: rgba(201,168,76,0.15); color: var(--gold);   border: 1px solid rgba(201,168,76,0.3); }
    .badge-cancelled  { background: rgba(231,76,60,0.15);  color: var(--red);    border: 1px solid rgba(231,76,60,0.3); }
    .badge-failed     { background: rgba(231,76,60,0.15);  color: var(--red);    border: 1px solid rgba(231,76,60,0.3); }

    /* Status dropdown in table */
    .status-select {
      background: var(--dark3);
      border: 1px solid var(--dark4);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      outline: none;
      margin-top: 6px;
      width: 100%;
    }
    .update-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      width: 100%;
    }
    .update-btn:hover { background: var(--gold-light); }
    .update-btn:disabled { background: var(--dark4); color: var(--text-muted); cursor: not-allowed; }
    .update-success { color: var(--green); font-size: 0.75rem; margin-top: 4px; display: none; }

    /* Items list in table */
    .items-list { list-style: none; }
    .items-list li {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 2px 0;
      border-bottom: 1px solid var(--dark3);
    }
    .items-list li:last-child { border-bottom: none; }
    .item-name { color: var(--text); font-weight: 500; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state div { font-size: 2.5rem; margin-bottom: 12px; }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--dark2);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: var(--red); color: var(--red); }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--dark4);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main { padding: 16px; }
      header { padding: 14px 16px; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .refresh-btn { margin-left: 0; }
      table { font-size: 0.78rem; }
      th, td { padding: 10px 10px; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-box">
    <h1>GLAMBORROW</h1>
    <p>Admin Dashboard — Restricted Access</p>
    <input type="password" id="admin-password" placeholder="Enter admin password" 
           onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" onclick="login()">Sign In</button>
    <div class="login-error" id="login-error">❌ Incorrect password. Try again.</div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
  <header>
    <div class="header-left">
      <h1>GLAMBORROW Admin</h1>
      <span>Order Management Dashboard</span>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </header>

  <div class="main">

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value gold" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Complete</div>
        <div class="stat-value green" id="stat-complete">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value orange" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Delivered</div>
        <div class="stat-value" id="stat-delivered" style="color:var(--purple)">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Revenue (R)</div>
        <div class="stat-value green" id="stat-revenue">—</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input class="search-input" type="text" id="search-input" 
             placeholder="Search by email, order ID, school..." 
             oninput="filterOrders()">
      <select class="filter-select" id="status-filter" onchange="filterOrders()">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="complete">Complete</option>
        <option value="processing">Processing</option>
        <option value="delivered">Delivered</option>
        <option value="returned">Returned</option>
        <option value="refunded">Refunded</option>
        <option value="cancelled">Cancelled</option>
        <option value="failed">Failed</option>
      </select>
      <button class="refresh-btn" onclick="loadOrders()">⟳ Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div id="table-container">
        <div class="loading">
          <div class="loading-spinner"></div>
          Loading orders...
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = "http://localhost:3000";
  let adminKey = "";
  let allOrders = [];

  // ── LOGIN ──
  function login() {
    const pw = document.getElementById("admin-password").value;
    if (!pw) return;
    adminKey = pw;
    // Test the key by calling the admin API
    fetch(`${API}/admin/orders`, {
      headers: { "x-admin-key": adminKey }
    })
    .then(res => {
      if (res.status === 401) {
        document.getElementById("login-error").style.display = "block";
        adminKey = "";
      } else if (res.ok) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        return res.json();
      }
    })
    .then(data => {
      if (data) {
        allOrders = data;
        renderStats(data);
        renderTable(data);
      }
    })
    .catch(() => {
      document.getElementById("login-error").style.display = "block";
      document.getElementById("login-error").textContent = "❌ Could not connect to server.";
    });
  }

  function logout() {
    adminKey = "";
    allOrders = [];
    document.getElementById("admin-password").value = "";
    document.getElementById("login-error").style.display = "none";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
  }

  // ── LOAD ORDERS ──
  function loadOrders() {
    document.getElementById("table-container").innerHTML = `
      <div class="loading">
        <div class="loading-spinner"></div>
        Loading orders...
      </div>
    `;
    fetch(`${API}/admin/orders`, {
      headers: { "x-admin-key": adminKey }
    })
    .then(res => res.json())
    .then(data => {
      allOrders = data;
      renderStats(data);
      filterOrders();
    })
    .catch(() => showToast("Failed to load orders", true));
  }

  // ── STATS ──
  function renderStats(orders) {
    document.getElementById("stat-total").textContent = orders.length;
    document.getElementById("stat-complete").textContent = orders.filter(o => o.status === "complete").length;
    document.getElementById("stat-pending").textContent = orders.filter(o => o.status === "pending").length;
    document.getElementById("stat-delivered").textContent = orders.filter(o => o.status === "delivered").length;
    const revenue = orders
      .filter(o => o.status === "complete" || o.status === "delivered")
      .reduce((sum, o) => sum + (parseFloat(o.amount) || 0), 0);
    document.getElementById("stat-revenue").textContent = "R" + revenue.toFixed(2);
  }

  // ── FILTER ──
  function filterOrders() {
    const search = document.getElementById("search-input").value.toLowerCase();
    const statusFilter = document.getElementById("status-filter").value;

    const filtered = allOrders.filter(order => {
      const matchSearch =
        (order.email || "").toLowerCase().includes(search) ||
        (order.orderId || "").toLowerCase().includes(search) ||
        (order.schoolName || "").toLowerCase().includes(search) ||
        (order.contact || "").toLowerCase().includes(search);
      const matchStatus = !statusFilter || order.status === statusFilter;
      return matchSearch && matchStatus;
    });

    renderTable(filtered);
  }

  // ── RENDER TABLE ──
  function renderTable(orders) {
    if (orders.length === 0) {
      document.getElementById("table-container").innerHTML = `
        <div class="empty-state">
          <div>📦</div>
          <p>No orders found</p>
        </div>
      `;
      return;
    }

    const rows = orders.map(order => {
      const badge = `<span class="badge badge-${order.status || 'pending'}">${order.status || 'pending'}</span>`;
      const items = (order.cart || []).map(item =>
        `<li><span class="item-name">${item.name}</span> x${item.quantity} — R${(parseFloat(item.price) * item.quantity).toFixed(2)}</li>`
      ).join("");

      return `
        <tr>
          <td>
            <div class="order-id">#${order.orderId}</div>
            <div class="date">${order.createdAt || "N/A"}</div>
          </td>
          <td>
            <div class="customer-email">${order.email || "N/A"}</div>
            <div class="customer-phone">📞 ${order.contact || "N/A"}</div>
            <div class="customer-phone">💬 ${order.whatsapp || "N/A"}</div>
            <div class="customer-phone">🏫 ${order.schoolName || "N/A"}</div>
          </td>
          <td>
            <ul class="items-list">${items || '<li>No items</li>'}</ul>
          </td>
          <td><div class="amount">R${parseFloat(order.amount || 0).toFixed(2)}</div></td>
          <td>
            ${badge}
            <br>
            <select class="status-select" id="select-${order.orderId}">
              <option value="pending"     ${order.status==='pending'     ? 'selected':''}>Pending</option>
              <option value="complete"    ${order.status==='complete'    ? 'selected':''}>Complete</option>
              <option value="processing"  ${order.status==='processing'  ? 'selected':''}>Processing</option>
              <option value="delivered"   ${order.status==='delivered'   ? 'selected':''}>Delivered</option>
              <option value="returned"    ${order.status==='returned'    ? 'selected':''}>Returned</option>
              <option value="refunded"    ${order.status==='refunded'    ? 'selected':''}>Refunded</option>
              <option value="cancelled"   ${order.status==='cancelled'   ? 'selected':''}>Cancelled</option>
              <option value="failed"      ${order.status==='failed'      ? 'selected':''}>Failed</option>
            </select>
            <button class="update-btn" onclick="updateStatus('${order.orderId}')">Update</button>
            <div class="update-success" id="success-${order.orderId}">✅ Updated!</div>
          </td>
        </tr>
      `;
    }).join("");

    document.getElementById("table-container").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Order ID / Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  // ── UPDATE STATUS ──
  async function updateStatus(orderId) {
    const select = document.getElementById(`select-${orderId}`);
    const newStatus = select.value;
    const btn = select.nextElementSibling;
    const successEl = document.getElementById(`success-${orderId}`);

    btn.disabled = true;
    btn.textContent = "Saving...";

    try {
      const res = await fetch(`${API}/admin/update-order`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": adminKey
        },
        body: JSON.stringify({ orderId, status: newStatus })
      });

      const data = await res.json();

      if (res.ok) {
        // Update local data
        const order = allOrders.find(o => o.orderId === orderId);
        if (order) order.status = newStatus;

        btn.textContent = "Update";
        btn.disabled = false;
        successEl.style.display = "block";
        setTimeout(() => successEl.style.display = "none", 2000);

        // Refresh stats
        renderStats(allOrders);
        showToast(`Order updated to "${newStatus}"`);
      } else {
        throw new Error(data.error || "Update failed");
      }
    } catch (err) {
      btn.textContent = "Update";
      btn.disabled = false;
      showToast(err.message, true);
    }
  }

  // ── TOAST ──
  function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    toast.textContent = isError ? "❌ " + message : "✅ " + message;
    toast.className = "toast" + (isError ? " error" : "") + " show";
    setTimeout(() => toast.className = "toast" + (isError ? " error" : ""), 3000);
  }
</script>
</body>
</html>
