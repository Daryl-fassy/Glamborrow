  <style>
    body {

    /* ── Back button pinned to top-left ── */
    .back-nav {
      padding: 14px 20px;
      display: flex;
      align-items: center;
    }

    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .back-nav-btn:hover {
      background: rgba(250, 5, 5, 0.1);
      border-color: rgba(255,255,255,0.6);
    }

    .back-nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── Loading / error states ── */
    .state-message {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.5);
      font-size: 1.1rem;
    }
  </style>
</head>
